spring:
  application:
    name: plm-backend
    
  datasource:
    url: jdbc:mysql://localhost:3306/plmdb_dev?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: plm_user
    password: plm_password
      
  jpa:
    hibernate:
      ddl-auto: create-drop  # 개발환경: 재시작시 테이블 재생성
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  port: 8080

logging:
  level:
    com.plm.api: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE