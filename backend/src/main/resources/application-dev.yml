spring:
  application:
    name: plm-backend
    
  datasource:
    url: jdbc:mysql://localhost:3306/plmdb_dev?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: plm_user
    password: plm_password
      
  jpa:
    hibernate:
      ddl-auto: update  # 개발환경: 스키마 자동 업데이트 (데이터 유지)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
    session:
      timeout: 30m  # 30분 동안 활동 없으면 세션 만료
      cookie:
        http-only: true
        secure: false  # 개발환경에서는 false (프로덕션에서는 true)
        same-site: lax
      
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  port: 8080

logging:
  level:
    com.plm.api: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# 파일 업로드 설정
file:
  upload-dir: ./uploads